# The whole history, not just the diff: an access token committed once and removed later is
# still a leaked token, and this project reads credentials for a living.
name: Gitleaks

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed for organisation accounts; absent on a personal repository.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
