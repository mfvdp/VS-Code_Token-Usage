name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # The tests and the smoke test are not shipped: their fixtures stat-then-write on
          # purpose and assert on literal URLs, which reads as a finding only out of context.
          config: |
            paths-ignore:
              - test
              - test-e2e

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
