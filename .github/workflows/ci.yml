name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The transcript readers touch paths, inodes and line endings, so all three
        # platforms run the full suite — Windows is where the bar glyphs and the path
        # handling actually differ.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build bundles
        run: npm run build

      - name: Test
        run: npm test

      - name: Privacy check (http literals against the allow-list)
        run: npm run check:privacy
