# The dependencies are few and all of them are build-time (esbuild, typescript, vsce), so the
# risk is not a breaking upgrade — it is an update nobody notices for a year. Weekly, with
# minor and patch updates collected into one pull request per ecosystem: a single PR is read,
# five separate ones are waved through. A major version arrives on its own, because that is
# the one that has to be judged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # Two majors are judged already and declined: the Node types follow the Node that VS Code
    # ships (22), and a TypeScript major is a compiler change, not an update. Ignoring them
    # here keeps Dependabot from reopening the same two pull requests every week.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
